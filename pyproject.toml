[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nacos-mcp"
version = "1.0.0"
description = "Nacos MCP Server - 配置管理 + 服务发现 + 命名空间查询，支持 Nacos 1.x/2.x"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "pkyit" }
]
keywords = ["mcp", "model-context-protocol", "nacos", "configuration", "service-discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0,<2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/pkyit/nacos-mcp"
Repository = "https://github.com/pkyit/nacos-mcp"

[project.scripts]
nacos-mcp = "jewei_mcp_nacos.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jewei_mcp_nacos"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
